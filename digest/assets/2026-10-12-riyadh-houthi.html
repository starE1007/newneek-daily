<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후티의 사정거리 — 예멘에서 리야드까지</title>
<style>
  :root{--text:#2C2C2B;--text2:#7D7A75;--canvas:#FFFFFF;--soft:#F9F8F7;--border:#E6E5E3;--blue:#2783DE;--orange:#D5803B;--orange-soft:#FBEBDE;--red:#E56458;--red-soft:#FCE9E7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;color:var(--text);background:var(--canvas);line-height:1.5;font-size:16px}
  .wrap{max-width:960px;margin:0 auto;padding:24px 24px 32px}
  .eyebrow{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:6px}
  h1{font-size:24px;line-height:1.3;margin-bottom:6px}
  .sub{font-size:15px;color:var(--text2);margin-bottom:20px}
  .card{border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .card svg{display:block;width:100%;height:auto}
  .section-title{font-size:17px;font-weight:700;margin:24px 0 12px}
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
  .step{flex:1 1 150px;border-radius:10px;padding:12px;font-size:13.5px;font-weight:600;text-align:center;background:var(--orange-soft);color:#9A5620;display:flex;align-items:center;justify-content:center}
  .step.a{background:var(--red-soft);color:#B23F34}
  .arrow{align-self:center;color:#B9B6B1;font-weight:700}
  .foot{margin-top:20px;font-size:12.5px;color:var(--text2)}
  @media (max-width:640px){.wrap{padding:16px}h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">2026.10.12 데일리 뉴스 · 시각자료</div>
  <h1>🗺️ 예멘 후티가 리야드 공항까지 닿았다</h1>
  <div class="sub">후티 근거지(예멘)에서 사우디 수도 리야드까지 — 개략 위치와 확전 경로</div>
  <div class="card">
    <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="아라비아반도 개략 지도">
      <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#E56458"/></marker></defs>
      <rect width="900" height="560" fill="#F0EFED"/>
      <path d="M0,0 L130,0 C150,120 210,260 330,420 C380,480 400,520 400,560 L0,560 Z" fill="#D8E9F7" stroke="#B9D4EC"/>
      <path d="M540,60 L900,60 L900,230 C800,190 700,170 620,140 Z" fill="#D8E9F7" stroke="#B9D4EC"/>
      <path d="M400,560 C560,520 700,470 900,380 L900,560 Z" fill="#D8E9F7" stroke="#B9D4EC"/>
      <path d="M330,420 L560,380 L640,440 L560,490 L420,500 Z" fill="#E56458" fill-opacity="0.14" stroke="#E56458" stroke-dasharray="4 3"/>
      <g font-style="italic" fill="#5B87B5" font-size="13" text-anchor="middle"><text x="70" y="200">홍해</text><text x="760" y="110">페르시아만</text><text x="620" y="520">아라비아해</text></g>
      <g fill="#7D7A75" font-weight="600" text-anchor="middle" font-size="16"><text x="420" y="200">사우디아라비아</text><text x="620" y="40" font-size="14">이란 →</text></g>
      <text x="470" y="450" font-size="14" font-weight="700" fill="#C6493E" text-anchor="middle">예멘 · 후티 근거지</text>
      <path d="M480,400 C490,350 500,310 520,262" fill="none" stroke="#E56458" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ah)"/>
      <circle cx="526" cy="248" r="22" fill="#E56458" opacity="0.15"/>
      <circle cx="526" cy="248" r="12" fill="#E56458" stroke="#fff" stroke-width="3"/>
      <line x1="520" y1="254" x2="532" y2="242" stroke="#fff" stroke-width="3"/>
      <rect x="590" y="200" width="250" height="46" rx="8" fill="#fff" stroke="#E6E5E3"/>
      <text x="715" y="219" font-size="14" font-weight="700" text-anchor="middle">킹칼리드 국제공항 (리야드)</text>
      <text x="715" y="237" font-size="12.5" font-weight="700" fill="#E56458" text-anchor="middle">10일 피격 · 사상자 321명</text>
    </svg>
  </div>
  <div class="section-title">확전하면 나한테 오는 영향</div>
  <div class="flow">
    <div class="step a">후티 공격<br>(리야드)</div><div class="arrow">→</div>
    <div class="step">미국 개입 검토</div><div class="arrow">→</div>
    <div class="step">걸프 긴장 확대</div><div class="arrow">→</div>
    <div class="step">유가·해운 보험료 상승</div><div class="arrow">→</div>
    <div class="step a">물가·금리 부담</div>
  </div>
  <div class="foot">※ 이해를 돕기 위한 개략도(위치·거리는 정밀하지 않음) · 2026.10.12 딥다이브 기반</div>
</div>
</body>
</html>
