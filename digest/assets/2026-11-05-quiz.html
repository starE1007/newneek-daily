<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 뉴스 퀴즈 · 2026.11.05</title>
<style>
  :root{
    --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --surface2:#F0EFED;
    --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC; --orange:#D5803B; --orange-soft:#FBEBDE;
    --red:#E56458; --red-soft:#FCE9E7; --green:#46A171; --green-soft:#E8F1EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;color:var(--text);background:var(--canvas);line-height:1.5;font-size:16px}
  .wrap{max-width:720px;margin:0 auto;padding:22px 20px 32px}
  .eyebrow{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.04em;margin-bottom:6px}
  h1{font-size:21px;line-height:1.3;margin-bottom:4px}
  .sub{font-size:14px;color:var(--text2);margin-bottom:18px}

  .qcard{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--soft);margin-bottom:14px}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .qnum{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 9px;border-radius:99px}
  .qtype{font-size:12px;color:var(--text2)}
  .qtext{font-size:15px;font-weight:600;margin-bottom:12px}

  .opt{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--canvas);cursor:pointer;font-size:14px;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--blue)}
  .opt input{accent-color:var(--blue)}
  .opt.picked{border-color:var(--blue);background:var(--blue-soft)}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}

  .sa-input{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit}
  .sa-input:focus{outline:none;border-color:var(--blue)}
  .sa-input.correct{border-color:var(--green);background:var(--green-soft)}
  .sa-input.wrong{border-color:var(--red);background:var(--red-soft)}

  .explain{display:none;margin-top:10px;font-size:13.5px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:10px 12px}
  .explain.show{display:block}
  .explain b{color:var(--text)}

  .btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14.5px;font-weight:700;border-radius:99px;padding:11px 20px;border:none;cursor:pointer}
  #submitBtn{background:var(--blue);color:#fff}
  #submitBtn:disabled{background:#B9D4EC;cursor:default}
  #retryBtn{background:var(--surface2);color:var(--text)}

  .score{display:none;margin-top:16px;border-radius:12px;padding:16px 18px;background:var(--blue-soft);font-size:15px;font-weight:700;color:#1B6BB8}
  .score.show{display:block}
  .score span{font-weight:400;font-size:13px;color:var(--text2);display:block;margin-top:4px}

  @media (max-width:640px){
    .wrap{padding:16px 14px 24px}
    h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">2026.11.05 데일리 뉴스 · 퀴즈</div>
  <h1>🧠 오늘의 뉴스 퀴즈</h1>
  <div class="sub">암기 말고 이해! 객관식 4문제 + 주관식 1문제. 제출하면 바로 채점 · 해설이 떠.</div>

  <div id="quizArea"></div>

  <div class="btnrow">
    <button id="submitBtn">제출하고 채점하기</button>
    <button id="retryBtn">🔄 새 문제 출제</button>
  </div>
  <div class="score" id="score"></div>
</div>
<script>

// 문제은행 — 개념(concept)별 변형 문제. 오답은 그럴듯하지만 한 군데가 틀린 쪽으로 짰고,
// 보기 길이도 서로 비슷하게 맞췄다. 정답 위치는 render 단계에서 보기를 셔플해 매번 달라진다.

const MC_BANK = [
  { id:'cycle', variants:[
    { q:'필수의료 공백을 두고 "의대 정원을 늘려도 그 과는 계속 빈다"는 지적이 나오는 이유로 가장 알맞은 것은?',
      opts:['정원이 늘면 의사 면허 시험이 더 어려워지기 때문',
            '같은 면허로 부담이 적은 과를 고를 수 있어 늘어난 인원이 다른 과로 가기 때문',
            '필수의료 과는 법으로 신규 전문의 수를 제한하고 있기 때문',
            '정원이 늘면 기존 전문의가 자동으로 다른 과로 재배치되기 때문'],
      answer:1,
      explain:'공백은 <b>인원의 문제가 아니라 \'남아 있을 이유\'의 문제</b>야. 야간·고난도 업무와 법적 위험이 그대로면 늘어난 인원도 그 과를 피해.' },
    { q:'아주대 사례에서 전문의 9명 중 8명이 사직 의사를 밝힌 일이 \'공백의 고리\'를 보여준다고 할 때, 그 고리의 순서로 가장 알맞은 것은?',
      opts:['기피 → 당직이 남은 사람에게 몰림 → 이탈 → 기피가 더 심해짐',
            '정원 확대 → 경쟁 심화 → 임금 하락 → 이탈',
            '수사 강화 → 의료사고 감소 → 환자 증가 → 과부하',
            '이탈 → 정원 축소 → 지원자 감소 → 수사 강화'],
      answer:0,
      explain:'한 사건이 고리 전체를 당긴 셈이야 — <b>부담·위험 → 기피 → 남은 사람 과부하 → 추가 이탈</b>로 돌아.' },
  ]},
  { id:'probe', variants:[
    { q:'응급실 압수수색을 두고 의료계와 환자단체가 갈린 지점으로 가장 알맞은 것은?',
      opts:['의료사고 수사를 아예 없앨지 말지',
            '진료 공백을 줄이는 것과 피해자의 증거 확보 권리 중 어디에 무게를 둘지',
            '응급실 진료비를 누가 부담할지',
            '필수의료 과를 몇 개로 정할지'],
      answer:1,
      explain:'양쪽 다 \'응급실의 특수성 고려\'엔 동의해. 갈리는 건 <b>수사를 어디까지 제한해도 되는지</b>의 선이야.' },
    { q:'정부가 필수의료 분야 의사의 \'의료사고 배상 보험료\'를 지원하겠다고 한 것은 어떤 효과를 노린 것인가?',
      opts:['의료사고가 나도 책임을 묻지 않게 하려는 것',
            '나쁜 결과에 따르는 금전 위험을 개인에게서 떼어내 기피 이유를 줄이려는 것',
            '응급실 진료 건수를 늘려 수익을 보전하려는 것',
            '병원이 보험사를 직접 설립하게 하려는 것'],
      answer:1,
      explain:'형사 책임 자체가 사라지는 게 아니라, <b>배상 부담</b>을 국가가 나눠 져서 기피의 이유 하나를 덜어내는 접근이야.' },
  ]},
  { id:'lag', variants:[
    { q:'순천대·경국대 의대 신설이 \'지금의 공백 대책\'으로 보기 어려운 이유로 가장 알맞은 것은?',
      opts:['정원이 100명으로 적어 효과가 없기 때문',
            '첫 입학이 2030년이고 전문의로 현장에 서는 건 2040년 안팎이기 때문',
            '신설 의대 졸업생은 지역에서만 일할 수 없기 때문',
            '의대 신설은 응급의학과를 두지 않기 때문'],
      answer:1,
      explain:'의대 6년에 수련 기간이 더 붙어. <b>공급 대책과 공백 대책은 도착 시점이 10년 넘게 벌어져</b> 있어.' },
    { q:'\'계약형 지역필수의사제\'가 겨냥하는 고리로 가장 알맞은 것은?',
      opts:['의대 입학 정원 자체를 줄이는 것',
            '사람이 몰리지 않는 지역의 당직 부담을 분산하는 것',
            '응급실 압수수색 요건을 강화하는 것',
            '전문의 자격 시험 기간을 단축하는 것'],
      answer:1,
      explain:'내년부터 <b>서울 제외 전 지역</b>에서 시행돼. 지역 근무를 약속하면 지원을 받는 구조로 \'남은 사람 과부하\' 단계를 건드려.' },
  ]},
  { id:'dalian', variants:[
    { q:'미국이 SK하이닉스의 중국 다롄 공장 증설 장비를 막은 일이 \'미국 내 투자\'에까지 영향을 준다고 하는 이유는?',
      opts:['미국 공장 건설 자금을 다롄 공장 수익으로 대려 했기 때문',
            '다롄 공장에서 미국 공장으로 장비를 옮겨야 했기 때문',
            '미국 공장 허가가 중국 정부의 승인을 받아야 하기 때문',
            '미국 공장의 제품을 전량 중국에 팔기로 했기 때문'],
      answer:0,
      explain:'<b>중국 공장 수익 → 미국 투자 재원</b>이라는 연결이 끊긴 거야. \'미국에 투자하라\'와 \'중국 기술은 막아라\'가 한 회사 안에서 부딪히는 구도.' },
    { q:'이번 다롄 건이 보여주는 미국 정책의 성격으로 가장 알맞게 짚은 것은?',
      opts:['대중 기술 통제를 사실상 접고 투자 유치로 돌아섰다',
            '투자 유치와 대중 기술 통제라는 두 목표가 서로 부딪히는 상태다',
            '한국 기업에만 적용되는 예외 규정이 생겼다',
            '반도체 장비 수출은 전면 금지로 바뀌었다'],
      answer:1,
      explain:'협의를 10차례 가까이 했는데도 \'증산·공정 개선용 장비는 안 된다\'는 입장이 그대로였어 — <b>통제 쪽이 더 센</b> 상태인 거야.' },
  ]},
];

const SA_BANK = [
  { q:'산부인과·소아청소년과·응급의학과처럼 없으면 대체가 안 되는 진료 영역을 묶어 부르는 말은? (네 글자)',
    accept:['필수의료'],
    explain:'정답은 <b>필수의료</b>. \'급하고, 어렵고, 결과가 나쁠 수 있다\'가 공통점이야.' },
  { q:'신설 의대의 첫 신입생이 입학하는 해는 몇 년일까? (숫자만)',
    accept:['2030','2030년'],
    explain:'정답은 <b>2030년</b>. 전문의로 현장에 서는 건 2040년 안팎이라 시차가 10년 넘게 벌어져.' },
  { q:'복습: 대통령 거부권을 의회가 뒤집으려면 상·하원 각각 몇 분의 몇 이상 찬성이 필요할까? (예: 2분의 1)',
    accept:['3분의 2','삼분의 이','3분의2','2/3'],
    explain:'정답은 <b>3분의 2</b>. 과반보다 문턱이 높아서 상대 당 이탈표가 있어야 해.' },
];


function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let current = [];

function buildQuiz(){
  current = [];
  const pickedConcepts = shuffle(MC_BANK).slice(0,4);
  pickedConcepts.forEach(c=>{
    const variant = c.variants[Math.floor(Math.random()*c.variants.length)];
    const optOrder = shuffle(variant.opts.map((text,idx)=>({text,idx})));
    current.push({
      type:'mc',
      q: variant.q,
      opts: optOrder.map(o=>o.text),
      answerIdx: optOrder.findIndex(o=>o.idx===variant.answer),
      explain: variant.explain,
    });
  });
  const sa = SA_BANK[Math.floor(Math.random()*SA_BANK.length)];
  current.push({ type:'sa', q: sa.q, accept: sa.accept, explain: sa.explain });

  render();
}

function render(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  current.forEach((item,i)=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.dataset.idx = i;
    let inner = `<div class="qhead"><span class="qnum">Q${i+1}</span><span class="qtype">${item.type==='mc' ? '객관식' : '주관식 · 단답형'}</span></div>`;
    inner += `<div class="qtext">${item.q}</div>`;
    if(item.type==='mc'){
      item.opts.forEach((opt,oi)=>{
        inner += `<label class="opt" data-oi="${oi}"><input type="radio" name="q${i}" value="${oi}">${opt}</label>`;
      });
    } else {
      inner += `<input type="text" class="sa-input" placeholder="답을 입력해줘">`;
    }
    inner += `<div class="explain"></div>`;
    card.innerHTML = inner;
    area.appendChild(card);
  });

  area.querySelectorAll('.opt').forEach(label=>{
    label.addEventListener('click', ()=>{
      const card = label.closest('.qcard');
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked'));
      label.classList.add('picked');
    });
  });

  document.getElementById('submitBtn').disabled = false;
  document.getElementById('score').classList.remove('show');
}

function grade(){
  let correctCount = 0;
  const cards = document.querySelectorAll('.qcard');
  cards.forEach((card,i)=>{
    const item = current[i];
    const explainEl = card.querySelector('.explain');
    if(item.type==='mc'){
      const picked = card.querySelector('.opt.picked');
      const pickedIdx = picked ? parseInt(picked.dataset.oi) : -1;
      card.querySelectorAll('.opt').forEach(o=>{
        const oi = parseInt(o.dataset.oi);
        if(oi === item.answerIdx) o.classList.add('correct');
        else if(oi === pickedIdx) o.classList.add('wrong');
      });
      if(pickedIdx === item.answerIdx) correctCount++;
    } else {
      const input = card.querySelector('.sa-input');
      const val = input.value.trim().toLowerCase().replace(/\s+/g,' ');
      const ok = val.length>0 && item.accept.some(a=>{
        const t = a.toLowerCase();
        return val.includes(t) || t.includes(val);
      });
      input.classList.add(ok ? 'correct' : 'wrong');
      input.disabled = true;
      if(ok) correctCount++;
    }
    explainEl.innerHTML = `<b>해설.</b> ${item.explain}`;
    explainEl.classList.add('show');
  });

  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
  document.getElementById('submitBtn').disabled = true;

  const scoreEl = document.getElementById('score');
  scoreEl.innerHTML = `${correctCount} / ${current.length} 문제 정답!<span>다시 풀고 싶으면 '새 문제 출제'를 눌러봐 — 보기 순서와 문제가 바뀌어.</span>`;
  scoreEl.classList.add('show');
}

document.getElementById('submitBtn').addEventListener('click', grade);
document.getElementById('retryBtn').addEventListener('click', buildQuiz);

buildQuiz();
</script>
</body>
</html>
