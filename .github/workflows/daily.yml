name: Daily NewNeek Scrape

on:
  schedule:
    - cron: '30 20 * * 0-4' # 05:30 KST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape NewNeek
        run: node scripts/scrape.mjs

      - name: Commit raw file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/newneek.md
          git diff --quiet --cached || git commit -m "chore: scrape $(date -u +%F)"
          git push

      # 스크랩이 성공했는데 이 한 줄 때문에 잡 전체가 실패로 찍히면 안 된다.
      # 2026-08-09~13 다섯 번의 실패가 전부 이것이었다 — 스크랩·커밋·푸시는 매번 성공했고
      # 여기서만 exit 22(HTTP 오류)가 났다. 루틴이 지워져 404 가 나고 있기 때문이다.
      # 알림은 **곁다리**다. 곁다리가 본체를 죽이면 안 된다.
      - name: Trigger Claude routine
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${{ secrets.CLAUDE_ROUTINE_TOKEN }}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json")
          echo "routine fire -> HTTP $code"
          if [ "$code" = "404" ]; then
            echo "::warning::루틴($ROUTINE_ID)이 없다. 발행 루틴을 다시 붙여야 한다 (STATUS C2)."
          elif [ "$code" -ge 400 ]; then
            echo "::warning::루틴 깨우기 실패 HTTP $code"
          fi
        env:
          # 루틴을 다시 만들면 **여기 한 줄만** 바꾸면 된다
          ROUTINE_ID: trig_01HSPoznGipPbsLmMkxn3XCn
